<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fondo circular degradado azul oscuro -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0A0F1E"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Ola superior -->
  <path d="M6 26 C14 20, 22 32, 32 26 C42 20, 50 32, 58 26"
        stroke="url(#wave)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Ola principal -->
  <path d="M6 34 C14 28, 22 40, 32 34 C42 28, 50 40, 58 34"
        stroke="url(#wave)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Ola inferior -->
  <path d="M6 42 C14 36, 22 48, 32 42 C42 36, 50 48, 58 42"
        stroke="url(#wave)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Letras CA -->
  <text x="32" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="13"
        font-weight="700" fill="white" letter-spacing="1" opacity="0.95">CA</text>
</svg>
